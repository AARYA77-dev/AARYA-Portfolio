<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bat Loader Demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
<style>
  :root {
    --bg: #0d0d10;
    --fg: #f5f5f5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  .page-content {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    flex-direction: column;
    gap: 1rem;
  }

  .page-content h1 { font-size: 2.5rem; letter-spacing: -1px; }
  .page-content p { opacity: 0.6; }

  .replay-btn {
    margin-top: 1rem;
    padding: 0.6rem 1.4rem;
    background: transparent;
    border: 1px solid var(--fg);
    color: var(--fg);
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .replay-btn:hover {
    background: var(--fg);
    color: var(--bg);
  }

  /* ---------- LOADER ---------- */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .counter {
    display: flex;
    position: relative;
  }

  .count {
    height: 6rem;
    overflow: hidden;
  }

  .digit h1 {
    font-size: 6rem;
    font-weight: 700;
    transform: translateY(100%);
    color: var(--fg);
  }

  /* bat layer sits above everything during exit */
  .bat-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1000;
    overflow: hidden;
  }

  .bat {
    position: absolute;
    width: 60px;
    height: 40px;
    top: 50%;
    left: -100px;
    opacity: 0;
    will-change: transform, opacity;
  }

  .bat svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .bat svg ellipse,
  .bat svg path {
    fill: #111;
  }

  .bat .wing-left,
  .bat .wing-right {
    transform-origin: 50% 50%;
  }
</style>
</head>
<body>

  <!-- ===== Loader ===== -->
  <div class="loader" id="loader">
    <div class="counter">
      <div class="count"><div class="digit"><h1>3</h1></div></div>
      <div class="count"><div class="digit"><h1>2</h1></div></div>
      <div class="count"><div class="digit"><h1>1</h1></div></div>
    </div>
  </div>

  <div class="bat-container" id="batContainer"></div>

  <!-- ===== Page content behind the loader ===== -->
  <div class="page-content">
    <h1>Welcome</h1>
    <p>The loader just flew away.</p>
    <button class="replay-btn" id="replayBtn">Replay Intro</button>
  </div>

<script>
gsap.registerPlugin(CustomEase);
CustomEase.create("hop", "0.22,1,0.36,1");

function createBatSVG() {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 100 60");

  const body = document.createElementNS(ns, "ellipse");
  body.setAttribute("cx", "50");
  body.setAttribute("cy", "30");
  body.setAttribute("rx", "6");
  body.setAttribute("ry", "10");

  const wingLeft = document.createElementNS(ns, "path");
  wingLeft.setAttribute("class", "wing-left");
  wingLeft.setAttribute("d", "M50,30 C30,10 10,15 0,30 C15,28 30,32 50,30 Z");

  const wingRight = document.createElementNS(ns, "path");
  wingRight.setAttribute("class", "wing-right");
  wingRight.setAttribute("d", "M50,30 C70,10 90,15 100,30 C85,28 70,32 50,30 Z");

  svg.append(body, wingLeft, wingRight);
  return svg;
}

function runBatExit(tl, container, loader) {
  // grid of bats sized to fully blanket the viewport
  const cols = 12;
  const rows = 8;
  const bats = [];
  const flapTweens = [];

  const cellW = 100 / cols;
  const cellH = 100 / rows;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const wrapper = document.createElement("div");
      wrapper.className = "bat";
      wrapper.appendChild(createBatSVG());
      container.appendChild(wrapper);

      // jittered position within its grid cell so it doesn't look like a rigid grid
      const jitterX = (Math.random() - 0.5) * cellW * 0.7;
      const jitterY = (Math.random() - 0.5) * cellH * 0.7;
      const topPct = r * cellH + cellH / 2 + jitterY;
      const leftPct = c * cellW + cellW / 2 + jitterX;
      const scale = 0.7 + Math.random() * 0.6;
      const flapDelay = Math.random() * 0.3;

      gsap.set(wrapper, {
        top: `${topPct}%`,
        left: `${leftPct}%`,
        xPercent: -50,
        yPercent: -50,
        scale,
        opacity: 0
      });

      bats.push({ el: wrapper, topPct, leftPct, scale, flapDelay });
    }
  }

  // start every wing flapping (kept running through the whole sequence)
  bats.forEach(({ el, flapDelay }) => {
    const wingLeft = el.querySelector(".wing-left");
    const wingRight = el.querySelector(".wing-right");
    const flap = gsap.to([wingLeft, wingRight], {
      scaleX: 0.35,
      duration: 0.07 + Math.random() * 0.03,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut",
      delay: flapDelay
    });
    flapTweens.push(flap);
  });

  // 1) bats swarm in fast, from slightly enlarged + faded, to fully cover the screen
  tl.to(bats.map(b => b.el), {
    opacity: 1,
    scale: (i) => bats[i].scale,
    duration: 0.35,
    stagger: { each: 0.006, from: "random" },
    ease: "power2.out"
  }, ">-0.1");

  // 2) the moment bats fully cover, drop the solid loader background beneath them
  tl.set(loader, { opacity: 0 }, ">-0.05");
  tl.set(loader, { display: "none" });

  // 3) hold the full-cover pose briefly so it reads as a solid blackout
  tl.to({}, { duration: 0.15 });

  // 4) the whole flock flies off-screen together in one direction, revealing the page
  const exitAngle = Math.random() * Math.PI * 2; // random flight direction each run
  const travel = Math.max(window.innerWidth, window.innerHeight) * 1.4;
  const exitX = Math.cos(exitAngle) * travel;
  const exitY = Math.sin(exitAngle) * travel;

  tl.to(bats.map(b => b.el), {
    x: `+=${exitX}`,
    y: `+=${exitY}`,
    duration: 0.9,
    ease: "power2.in",
    stagger: { each: 0.008, from: "random" }
  }, ">");

  tl.to(bats.map(b => b.el), {
    opacity: 0,
    duration: 0.3
  }, "-=0.3");

  tl.add(() => flapTweens.forEach(t => t.kill()), ">");
}

function runLoaderAnimation() {
  const loader = document.getElementById("loader");
  const batContainer = document.getElementById("batContainer");
  batContainer.innerHTML = "";

  gsap.set(loader, { display: "flex", opacity: 1 });
  gsap.set(".digit h1", { y: "100%" });

  const tl = gsap.timeline({
    defaults: { ease: "hop" },
    onComplete: () => { loader.style.display = "none"; }
  });

  const counts = document.querySelectorAll(".count");

  counts.forEach((count, index) => {
    const digit = count.querySelectorAll(".digit h1");

    tl.to(digit, { y: "0%", duration: 1, stagger: 0.075 }, index);

    if (index < counts.length) {
      tl.to(digit, { y: "-100%", duration: 1, stagger: 0.075 }, index + 1);
    }
  });

  // bats swarm in to fully cover the screen, hold, then fly off together
  runBatExit(tl, batContainer, loader);

  return tl;
}

// run once on load
runLoaderAnimation();

// replay button
document.getElementById("replayBtn").addEventListener("click", runLoaderAnimation);
</script>
</body>
</html>

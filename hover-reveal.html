<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hover Reveal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root {
    --bg: #0d0d10;
    --fg: #f5f5f5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1.5rem;
  }

  h1 { font-size: 1.4rem; opacity: 0.8; font-weight: 500; }

  .reveal-card {
    position: relative;
    width: 320px;
    height: 400px;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }

  .reveal-card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* your real photo, sits underneath */
  .photo-layer {
    z-index: 1;
  }

  /* the cover image (Batman), sits on top and hides the photo by default */
  .cover-layer {
    z-index: 2;
    will-change: transform, opacity;
  }

  .cover-label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 3;
    padding: 1rem;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    pointer-events: none;
  }

  p.hint {
    opacity: 0.5;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

  <h1>Hover to reveal</h1>

  <div class="reveal-card" id="revealCard">
    <!-- your actual photo underneath -->
    <img class="photo-layer" src="aarya.webp" alt="My photo" />

    <!-- cover image on top, replace with your own Batman image file -->
    <img class="cover-layer" id="coverLayer" src="batman.png" alt="Cover" />

    <div class="cover-label" id="coverLabel">Hover to reveal</div>
  </div>

  <p class="hint">Swap <code>batman-cover.jpg</code> and <code>my-photo.jpg</code> with your real files.</p>

<script>
  const card = document.getElementById("revealCard");
  const cover = document.getElementById("coverLayer");
  const label = document.getElementById("coverLabel");

  gsap.set(cover, { transformOrigin: "50% 50%" });

  const tl = gsap.timeline({ paused: true })
    .to(cover, {
      opacity: 0,
      scale: 1.08,
      duration: 0.5,
      ease: "power2.out"
    })
    .to(label, {
      opacity: 0,
      duration: 0.3
    }, "<");

  card.addEventListener("mouseenter", () => tl.play());
  card.addEventListener("mouseleave", () => tl.reverse());

  // touch support: tap to reveal, tap again to cover
  let revealed = false;
  card.addEventListener("click", () => {
    revealed = !revealed;
    revealed ? tl.play() : tl.reverse();
  });
</script>
</body>
</html>

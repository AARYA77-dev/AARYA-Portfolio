<script>
    const now = new Date();
    const time = now.toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
    });
    document.getElementById("time").textContent = time;

    setupMobileNav();

    function setupMobileNav() {
        const nav = document.querySelector(".nav");
        const menuToggle = document.querySelector(".menu-toggle");
        const menu = document.querySelector(".menu");

        if (!nav || !menuToggle || !menu) return;

        function setMenu(open) {
            nav.classList.toggle("menu-open", open);
            document.body.classList.toggle("menu-open", open);
            menuToggle.setAttribute("aria-expanded", open ? "true" : "false");
            menuToggle.innerHTML = open
                ? '<i class="fa-solid fa-xmark"></i>'
                : '<i class="fa-solid fa-bars"></i>';
        }

        menuToggle.addEventListener("click", () => {
            setMenu(!nav.classList.contains("menu-open"));
        });

        menu.querySelectorAll("a").forEach((link) => {
            link.addEventListener("click", () => setMenu(false));
        });

        window.addEventListener("keydown", (event) => {
            if (event.key === "Escape") setMenu(false);
        });

        window.addEventListener("resize", () => {
            if (window.innerWidth > 768) setMenu(false);
        });
    }

    // Canvas-based Snow Particle System
    let snowCanvas = null;
    let snowCtx = null;
    let snowAnimationId = null;
    let particles = [];
    const maxParticles = 100;

    let footerBins = [];
    const binSize = 6;
    const maxPileHeight = 10;
    let landedFlakes = [];

    function initSnowCanvas() {
        snowCanvas = document.getElementById("snow-canvas");
        if (!snowCanvas) return;
        snowCtx = snowCanvas.getContext("2d");

        resizeSnowCanvas();
        window.addEventListener("resize", resizeSnowCanvas);

        particles = [];
        for (let i = 0; i < maxParticles; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                r: Math.random() * 2.5 + 1,
                d: Math.random() * 1.2 + 0.6,
                o: Math.random() * 0.8 + 0.2,
                sway: Math.random() * Math.PI * 2,
                swaySpeed: Math.random() * 0.03 + 0.01
            });
        }

        if (snowAnimationId) {
            cancelAnimationFrame(snowAnimationId);
        }
        animateSnow();
    }

    function resizeSnowCanvas() {
        if (snowCanvas) {
            snowCanvas.width = window.innerWidth;
            snowCanvas.height = window.innerHeight;
            footerBins = [];
            landedFlakes = [];
        }
    }

    function animateSnow() {
        if (!snowCanvas || !snowCtx) return;

        snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);

        const footerCard = document.querySelector(".optimize-footer .card") || document.querySelector(".optimize-footer");
        let footerRect = null;
        let numBins = 0;

        if (footerCard) {
            footerRect = footerCard.getBoundingClientRect();
            numBins = Math.max(1, Math.ceil(footerRect.width / binSize) + 1);
            if (footerBins.length !== numBins) {
                const oldBins = footerBins;
                footerBins = new Array(numBins).fill(0);
                for (let b = 0; b < numBins; b++) {
                    footerBins[b] = (oldBins && oldBins[b]) ? oldBins[b] : 0;
                }
            }
        }

        const edgeMargin = 22; // Edge boundary zone for slope gravity & falling

        // 1. Update and draw falling background particles
        for (let i = 0; i < maxParticles; i++) {
            const p = particles[i];

            snowCtx.beginPath();
            snowCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
            snowCtx.fillStyle = `rgba(255, 255, 255, ${p.o})`;
            snowCtx.fill();

            p.y += p.d;
            p.sway += p.swaySpeed;
            p.x += Math.sin(p.sway) * 0.6;

            let targetY = snowCanvas.height + 15;
            let isOnFooter = false;
            let binIdx = -1;

            if (footerRect && footerRect.top < snowCanvas.height && footerRect.bottom > 0) {
                if (p.x >= footerRect.left && p.x <= footerRect.right) {
                    binIdx = Math.floor((p.x - footerRect.left) / binSize);
                    binIdx = Math.max(0, Math.min(numBins - 1, binIdx));
                    const currentPile = footerBins[binIdx] || 0;
                    targetY = footerRect.top - currentPile;
                    isOnFooter = true;
                }
            }

            if (p.y >= targetY) {
                if (isOnFooter && binIdx >= 0) {
                    const distLeft = p.x - footerRect.left;
                    const distRight = footerRect.right - p.x;
                    const isNearEdge = distLeft < edgeMargin || distRight < edgeMargin;

                    const currentPile = footerBins[binIdx] || 0;
                    if (!isNearEdge && currentPile < maxPileHeight) {
                        footerBins[binIdx] += p.r * 0.4;
                        if (binIdx > 0 && footerBins[binIdx - 1] < maxPileHeight) {
                            footerBins[binIdx - 1] += p.r * 0.2;
                        }
                        if (binIdx < numBins - 1 && footerBins[binIdx + 1] < maxPileHeight) {
                            footerBins[binIdx + 1] += p.r * 0.2;
                        }
                    }

                    if (landedFlakes.length < 300) {
                        let initVx = 0;
                        let startsFalling = false;

                        if (distLeft < edgeMargin) {
                            initVx = -((edgeMargin - distLeft) / edgeMargin) * 0.8 - 0.3;
                            startsFalling = distLeft < 6;
                        } else if (distRight < edgeMargin) {
                            initVx = ((edgeMargin - distRight) / edgeMargin) * 0.8 + 0.3;
                            startsFalling = distRight < 6;
                        }

                        landedFlakes.push({
                            relX: (p.x - footerRect.left) / (footerRect.width || 1),
                            relY: -currentPile + (Math.random() * 2 - 1),
                            vx: initVx,
                            vy: startsFalling ? Math.random() * 0.5 + 0.3 : 0,
                            isFalling: startsFalling,
                            r: p.r,
                            o: Math.min(0.95, p.o + 0.15)
                        });
                    }
                }

                particles[i] = {
                    x: Math.random() * snowCanvas.width,
                    y: -10,
                    r: Math.random() * 2.5 + 1,
                    d: Math.random() * 1.2 + 0.6,
                    o: Math.random() * 0.8 + 0.2,
                    sway: Math.random() * Math.PI * 2,
                    swaySpeed: Math.random() * 0.03 + 0.01
                };
            }
        }

        // 2. Physics update & render for landed and edge-sliding snow flakes
        if (footerRect && footerRect.top < snowCanvas.height && footerRect.bottom > 0) {
            const footerW = footerRect.width || 1;

            for (let k = landedFlakes.length - 1; k >= 0; k--) {
                const lf = landedFlakes[k];
                const lx = footerRect.left + lf.relX * footerW;

                if (!lf.isFalling) {
                    const distLeft = lx - footerRect.left;
                    const distRight = footerRect.right - lx;

                    if (distLeft < edgeMargin) {
                        const slopeForce = (edgeMargin - distLeft) / edgeMargin;
                        lf.vx -= slopeForce * 0.18;
                    } else if (distRight < edgeMargin) {
                        const slopeForce = (edgeMargin - distRight) / edgeMargin;
                        lf.vx += slopeForce * 0.18;
                    } else {
                        lf.vx *= 0.88;
                    }

                    lf.relX += lf.vx / footerW;

                    const newLx = footerRect.left + lf.relX * footerW;
                    if (newLx < footerRect.left - 2 || newLx > footerRect.right + 2) {
                        lf.isFalling = true;
                        lf.vy = Math.random() * 0.5 + 0.4;
                    }
                } else {
                    lf.vy += 0.2; // Gravity accelerating the snow off the edge
                    lf.vx *= 0.98;
                    lf.relX += lf.vx / footerW;
                    lf.relY += lf.vy;

                    if (footerRect.top + lf.relY > snowCanvas.height + 20) {
                        landedFlakes.splice(k, 1);
                        continue;
                    }
                }

                snowCtx.beginPath();
                snowCtx.arc(footerRect.left + lf.relX * footerW, footerRect.top + lf.relY, lf.r, 0, Math.PI * 2);
                snowCtx.fillStyle = `rgba(255, 255, 255, ${lf.o})`;
                snowCtx.fill();
            }
        }

        snowAnimationId = requestAnimationFrame(animateSnow);
    }

    function stopSnow() {
        if (snowAnimationId) {
            cancelAnimationFrame(snowAnimationId);
            snowAnimationId = null;
        }
        if (snowCanvas && snowCtx) {
            snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
        }
        footerBins = [];
        landedFlakes = [];
        window.removeEventListener("resize", resizeSnowCanvas);
    }

    const THEME_KEY = "theme";
    const toggle = document.getElementById("toggle");

    function getThemeOriginPoint() {
        const img = document.querySelector(".image-ring img") ||
            document.querySelector(".image-ring") ||
            document.querySelector("img[src*='aarya']");

        if (img) {
            const rect = img.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0 &&
                rect.bottom >= 0 && rect.top <= window.innerHeight &&
                rect.right >= 0 && rect.left <= window.innerWidth) {
                return {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
            }
        }
        const toggleLabel = document.querySelector(".darkModeLabel");
        if (toggleLabel) {
            const rect = toggleLabel.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }
        return {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2
        };
    }

    function applyTheme(theme) {
        const isDark = theme === "dark";
        document.body.classList.toggle("dark", isDark);
        if (toggle) toggle.checked = isDark;

        if (typeof initSnowCanvas === "function") {
            if (isDark) {
                initSnowCanvas();
            } else {
                stopSnow();
            }
        }
    }

    function switchThemeWithRipple(theme) {
        if (document.documentElement.classList.contains("theme-transitioning")) return;

        const { x, y } = getThemeOriginPoint();
        const endRadius = Math.hypot(
            Math.max(x, window.innerWidth - x),
            Math.max(y, window.innerHeight - y)
        );

        if (document.startViewTransition && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            document.documentElement.classList.add("theme-transitioning");

            const transition = document.startViewTransition(() => {
                applyTheme(theme);
            });

            transition.ready.then(() => {
                document.documentElement.animate(
                    {
                        clipPath: [
                            `circle(0px at ${x}px ${y}px)`,
                            `circle(${endRadius}px at ${x}px ${y}px)`
                        ]
                    },
                    {
                        duration: 750,
                        easing: "cubic-bezier(0.4, 0, 0.2, 1)",
                        pseudoElement: "::view-transition-new(root)"
                    }
                );
            });

            transition.finished.then(() => {
                document.documentElement.classList.remove("theme-transitioning");
            });
        } else {
            const isDark = theme === "dark";
            const rippleColor = isDark ? "#0b1220" : "#eef5ff";

            const ripple = document.createElement("div");
            ripple.className = "theme-ripple-overlay";
            ripple.style.background = rippleColor;

            document.body.appendChild(ripple);

            const animation = ripple.animate(
                [
                    {
                        width: "0px",
                        height: "0px",
                        left: `${x}px`,
                        top: `${y}px`
                    },
                    {
                        width: `${endRadius * 2}px`,
                        height: `${endRadius * 2}px`,
                        left: `${x - endRadius}px`,
                        top: `${y - endRadius}px`
                    }
                ],
                {
                    duration: 750,
                    easing: "cubic-bezier(0.4, 0, 0.2, 1)"
                }
            );

            animation.onfinish = () => {
                applyTheme(theme);
                ripple.remove();
            };
        }
    }

    const savedTheme = localStorage.getItem(THEME_KEY) || "dark";
    applyTheme(savedTheme);

    if (toggle) {
        toggle.addEventListener("change", () => {
            const theme = toggle.checked ? "dark" : "light";
            localStorage.setItem(THEME_KEY, theme);
            switchThemeWithRipple(theme);
        });
    }

</script>

    const app = initializeApp(firebaseConfig);

        } finally {
            button.disabled = false;
            button.textContent = "Send Message";
        }
    });
</script>
